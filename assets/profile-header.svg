<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Hüseyin Durna — IT Operations and Business Systems</title>
  <desc id="desc">Dark editorial profile banner with burgundy and red accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.58" stop-color="#131018"/>
      <stop offset="1" stop-color="#260b13"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f1022"/>
      <stop offset="1" stop-color="#e53935"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1080" cy="62" r="130" fill="#e53935" fill-opacity="0.14" filter="url(#glow)"/>
  <circle cx="1070" cy="250" r="170" fill="#6f1022" fill-opacity="0.22" filter="url(#glow)"/>

  <rect x="72" y="72" width="54" height="6" rx="3" fill="url(#accent)"/>
  <text x="72" y="145" fill="#fff8f5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5">HÜSEYİN DURNA</text>
  <text x="75" y="190" fill="#d8cdd0" font-family="IBM Plex Mono, Consolas, monospace" font-size="20" letter-spacing="2.4">IT OPERATIONS  /  BUSINESS SYSTEMS</text>
  <text x="75" y="244" fill="#8b949e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" letter-spacing="1.2">ISTANBUL · TÜRKİYE</text>

  <g transform="translate(1010 104)">
    <rect x="0" y="0" width="78" height="78" rx="18" fill="none" stroke="#fff8f5" stroke-opacity="0.8" stroke-width="2"/>
    <path d="M20 58V20h38M20 40h25M45 20v38" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <rect x="0" y="314" width="1200" height="6" rx="3" fill="url(#accent)"/>
</svg>
