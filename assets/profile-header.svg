<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Hüseyin Durna — Systems that work</title>
  <desc id="desc">Premium dark systems dashboard banner with burgundy and red accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b10"/>
      <stop offset="0.56" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#200a11"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f1022"/>
      <stop offset="0.55" stop-color="#b91f35"/>
      <stop offset="1" stop-color="#e53935"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e53935" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e53935" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e53935" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1110" cy="85" r="180" fill="#e53935" fill-opacity="0.13" filter="url(#blur)"/>
  <circle cx="850" cy="440" r="230" fill="#6f1022" fill-opacity="0.18" filter="url(#blur)"/>

  <g opacity="0.14">
    <text x="43" y="360" fill="#fff8f5" font-family="Arial, sans-serif" font-size="300" font-weight="800">H</text>
  </g>

  <g transform="translate(70 54)">
    <rect width="210" height="32" rx="16" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="18" cy="16" r="5" fill="#44d17a">
      <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="21" fill="#aeb7c2" font-family="Consolas, monospace" font-size="11" letter-spacing="1.3">ISTANBUL · ONLINE</text>
  </g>

  <text x="70" y="144" fill="#9ba5b1" font-family="Consolas, monospace" font-size="15" letter-spacing="3">HÜSEYİN DURNA / 2026</text>
  <text x="67" y="216" fill="#fff8f5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-2.5">SYSTEMS THAT WORK.</text>
  <rect x="70" y="238" width="520" height="5" rx="2.5" fill="url(#red)"/>
  <text x="70" y="288" fill="#d1c8ca" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" letter-spacing="1.1">IT OPERATIONS  ·  INFRASTRUCTURE  ·  BUSINESS SYSTEMS</text>

  <g transform="translate(70 330)" font-family="Consolas, monospace" font-size="12" letter-spacing="1.5">
    <rect width="104" height="38" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.11"/>
    <text x="21" y="24" fill="#fff8f5">OPERATE</text>
    <rect x="116" width="92" height="38" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.11"/>
    <text x="139" y="24" fill="#fff8f5">BUILD</text>
    <rect x="220" width="106" height="38" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.11"/>
    <text x="241" y="24" fill="#fff8f5">IMPROVE</text>
  </g>

  <g transform="translate(775 68)">
    <rect width="355" height="282" rx="22" fill="#06080c" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="22" y="20" width="311" height="34" rx="9" fill="#ffffff" fill-opacity="0.045"/>
    <circle cx="42" cy="37" r="5" fill="#44d17a"/>
    <text x="57" y="42" fill="#b7c0ca" font-family="Consolas, monospace" font-size="11" letter-spacing="1">ALL SYSTEMS OPERATIONAL</text>

    <g fill="none" stroke="#ffffff" stroke-opacity="0.11">
      <path d="M74 112H168V91H267"/>
      <path d="M74 112H168V174H267"/>
      <path d="M168 174V231H267"/>
    </g>
    <path d="M74 112H168V91H267" fill="none" stroke="url(#line)" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="0 300;90 210;0 300" dur="3s" repeatCount="indefinite"/>
    </path>

    <g font-family="Consolas, monospace" font-size="10">
      <rect x="27" y="86" width="90" height="52" rx="10" fill="#6f1022" fill-opacity="0.18" stroke="#e53935" stroke-opacity="0.65"/>
      <text x="43" y="107" fill="#fff8f5">OPERATIONS</text>
      <text x="43" y="124" fill="#8b949e">CORE</text>

      <rect x="233" y="67" width="96" height="48" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.13"/>
      <text x="251" y="87" fill="#fff8f5">SERVERS</text>
      <text x="251" y="102" fill="#44d17a">● ACTIVE</text>

      <rect x="233" y="150" width="96" height="48" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.13"/>
      <text x="251" y="170" fill="#fff8f5">NETWORK</text>
      <text x="251" y="185" fill="#44d17a">● ACTIVE</text>

      <rect x="233" y="207" width="96" height="48" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.13"/>
      <text x="251" y="227" fill="#fff8f5">SYSTEMS</text>
      <text x="251" y="242" fill="#44d17a">● ACTIVE</text>
    </g>
  </g>

  <rect y="414" width="1200" height="6" rx="3" fill="url(#red)"/>
</svg>
